{% extends 'ventas/base.html' %}

{% block content %}
    <h2>Eliminar Producto</h2>
    <p>¿Estás seguro que deseas eliminar el producto "{{ object.nombre }}"?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'producto_list' %}" class="btn btn-cancel">Cancelar</a>
    </form>
{% endblock %}
